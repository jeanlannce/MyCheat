#########################################
### My Cheat - 决议（简体中文）
#########################################

 mycheat_category:0 "My Cheat 强化"
 mycheat_unlock_mio:0 "解锁军工企业"
 mycheat_unlock_mio_desc:0 "解锁本 mod 携带的 17 家特殊军工企业（MIO），解锁后可在「装备设计」界面正常研究其科技树。\n\n§Y包含§!：坦克、火炮、步兵装备、支援装备、摩托化/机械化、袭击舰、轻型飞机共 7 家通用军工企业，以及 10 家二次元专属军工企业。"
 mycheat_grant_characters:0 "获得全部角色"
 mycheat_grant_characters_desc:0 "一次性招募本 mod 携带的 58 名特殊角色。\n\n§Y包含§!：35 名陆军将领（其中多人可兼任内阁顾问）、17 名政治/军事顾问、6 名科学家。\n\n§R此决议只能执行一次。§!"

 mycheat_add_breakthrough:0 "添加科研突破点"
 mycheat_add_breakthrough_desc:0 "为特殊项目的某个学科添加科研突破点。\n\n先选择学科（陆军 / 海军 / 空军 / 核物理 / 全部），再选择添加数量（+1 / +2 / +3 / +5 / +20）。"
 mycheat_extra_leaders:0 "这是什么，点一下"
 mycheat_extra_leaders_desc:0 "获得 §Y12 名二次元将领§!（整合自 TYGC 的同名事件）。\n\n§Y10 名陆军将领§!：阿米娅、白子、十四行诗、三月七、露西亚 黎明、琪亚娜、户山香澄、里芙、安比、特别周\n§Y2 名海军将领§!：萨拉托加、列克星敦\n\n§G这些将领自带强力特质（攻击 / 防御 / 突破等）。§!\n\n§R此决议只能执行一次。§!"
 mycheat_add_resources:0 "添加战略资源"
 mycheat_add_resources_desc:0 "在首都地区刷出大量战略资源。\n\n三档：小开不算开（+50）/ 那咋了（+100）/ 演都不演了（+50000）。\n\n覆盖石油、钢铁、铝、橡胶、钨、铬、煤共 7 种资源。\n\n§R需要完全控制首都地区。§!"

