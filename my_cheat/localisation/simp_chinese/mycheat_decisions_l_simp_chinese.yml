§Y70 名特殊角色§!：
  • 58 名角色包：35 名陆军将领（多人可兼任内阁顾问）、17 名政治/军事顾问、6 名科学家
  • 12 名二次元将领：阿米娅、白子、十四行诗、三月七、露西亚 黎明、琪亚娜、户山香澄、里芙、安比、特别周（陆军）+ 萨拉托加、列克星敦（海军）

§R此决议只能执行一次。§!"

