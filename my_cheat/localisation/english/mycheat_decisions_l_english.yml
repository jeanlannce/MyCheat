 mycheat_grant_characters:0 "Visitors from Beyond"
 mycheat_grant_characters_desc:0 "Grants ALL content of this mod at once:

§Y17 Military Industrial Organizations§!: unlock their research trees in the Equipment Designer (7 general + 10 character-themed).

§Y70 custom characters§!:
  • 58-character pack: 35 army commanders (several can also serve as cabinet advisors), 17 political/military advisors, 6 scientists
  • 12 anime commanders: Amiya, Shiroko, Sonetto, March 7th, Lucia Dawn, Kiana, Kasumi Toyama, Lyfe, Anby, Special Week (army) + Saratoga, Lexington (navy)

§RThis decision can only be taken once.§!"

 mycheat_add_breakthrough:0 "Technological Breakthrough"
 mycheat_add_breakthrough_desc:0 "Adds research breakthrough points to a special project specialization.

First pick the specialization (Land / Naval / Air / Nuclear / All), then pick the amount (+1 / +2 / +3 / +5 / +20)."
