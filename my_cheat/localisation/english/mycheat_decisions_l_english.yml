 mycheat_grant_characters:0 "Visitors from Beyond"
 mycheat_grant_characters_desc:0 "Grants ALL content of this mod at once:\n\n§Y17 Military Industrial Organizations§!: unlock their research trees in the Equipment Designer (7 general + 10 character-themed).\n\n§Y70 custom characters§!:\n  - 58-character pack: 35 army commanders (several can also serve as cabinet advisors), 17 political/military advisors, 6 scientists\n  - 12 anime commanders: Amiya, Shiroko, Sonetto, March 7th, Lucia Dawn, Kiana, Kasumi Toyama, Lyfe, Anby, Special Week (army) + Saratoga, Lexington (navy)\n\n§RThis decision can only be taken once.§!"

 mycheat_add_breakthrough:0 "Technological Breakthrough"
 mycheat_add_breakthrough_desc:0 "Adds research breakthrough points to a special project specialization.\n\nFirst pick the specialization (Land / Naval / Air / Nuclear / All), then pick the amount (+1 / +2 / +3 / +5 / +20)."
# 已合并到 mycheat_grant_characters: mycheat_extra_leaders:0 "What Is This? Click It"
# 原「这是什么，点一下」描述已并入 mycheat_grant_characters_desc
 mycheat_add_resources:0 "Meteor Impact"
 mycheat_add_resources_desc:0 "A meteor strikes your capital, scattering vast strategic resources.\n\nThree tiers: +50 / +100 / +50000.\n\nCovers all 7 resources: oil, steel, aluminium, rubber, tungsten, chromium, coal.\n\n§RRequires full control of the capital state.§!"

