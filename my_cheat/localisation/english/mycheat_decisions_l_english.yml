 mycheat_add_resources:0 "Meteor Impact"
 mycheat_add_resources_desc:0 "A meteor strikes your capital, scattering vast strategic resources.

Three tiers: +50 / +100 / +50000.

Covers all 7 resources: oil, steel, aluminium, rubber, tungsten, chromium, coal.

§RRequires full control of the capital state.§!"

