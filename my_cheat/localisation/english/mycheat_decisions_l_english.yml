#########################################
### My Cheat - Decisions (English)
#########################################

 mycheat_category:0 "My Cheat"
 mycheat_unlock_mio:0 "Unlock Military Industrial Organizations"
 mycheat_unlock_mio_desc:0 "Unlocks the 17 custom Military Industrial Organizations (MIO) included in this mod. Once unlocked, their research trees become available in the Equipment Designer.\n\n§YIncludes§!: 7 general MIOs (tanks, artillery, infantry equipment, support equipment, motorized/mechanized, raiding fleet, light aircraft) and 10 character-themed MIOs."
 mycheat_grant_characters:0 "Grant All Characters"
 mycheat_grant_characters_desc:0 "Recruits all 58 custom characters included in this mod at once.\n\n§YIncludes§!: 35 army commanders (several can also serve as cabinet advisors), 17 political/military advisors, and 6 scientists.\n\n§RThis decision can only be taken once.§!"

 mycheat_add_breakthrough:0 "Add Research Breakthrough Points"
 mycheat_add_breakthrough_desc:0 "Adds research breakthrough points to a special project specialization.\n\nFirst pick the specialization (Land / Naval / Air / Nuclear / All), then pick the amount (+1 / +2 / +3 / +5 / +20)."
 mycheat_extra_leaders:0 "What Is This? Click It"
 mycheat_extra_leaders_desc:0 "Grants §Y12 anime commanders§! (integrated from the TYGC event of the same name).\n\n§Y10 army commanders§!: Amiya, Shiroko, Sonetto, March 7th, Lucia Dawn, Kiana, Kasumi Toyama, Lyfe, Anby, Special Week\n§Y2 navy leaders§!: Saratoga, Lexington\n\n§GThese commanders come with powerful traits (attack / defence / breakthrough).§!\n\n§RThis decision can only be taken once.§!"
 mycheat_add_resources:0 "Add Strategic Resources"
 mycheat_add_resources_desc:0 "Spawns a large amount of strategic resources in your capital state.\n\nThree tiers: +50 / +100 / +50000.\n\nCovers all 7 resources: oil, steel, aluminium, rubber, tungsten, chromium, coal.\n\n§RRequires full control of the capital state.§!"

